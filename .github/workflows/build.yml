name: Build

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  verify:
    name: Verify dashboard
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "22.x"
          cache: npm
      - uses: emscripten-core/setup-emsdk@v16
        with:
          version: 4.0.12
      - run: npm ci
      - run: npm run check-format
      - run: npm run typecheck
      - run: npm test
      - run: node --test tools/mock-backend/test/*.test.ts
      - run: npx tsc -p tools/mock-backend
      - run: npm run compile
      - run: npm run wasm:compile
      - run: npx playwright install --with-deps chromium
      - name: Exercise the cellular API in Electron
        run: xvfb-run -a npm run cellular-smoke -- --soak-seconds 120 --retention-seconds 330
        timeout-minutes: 5
      - uses: actions/upload-artifact@v7
        with:
          name: desktop-bundles
          path: bundles/
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: cellular-verification
          path: .screenshots/cellular/

  lite:
    name: Verify and package Lite
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "22.x"
          cache: npm
      - run: npm ci
      - run: npm run lite-build
      - run: npx playwright install --with-deps chromium
      - run: npm run lite-smoke -- --skip-build
        timeout-minutes: 5
      - name: Package standalone Lite
        run: |
          VERSION=$(node -p "require('./package.json').version")
          mkdir -p dist/lite/lite dist/lite/tools/lite-serve
          cp -rL lite/static dist/lite/lite/static
          cp tools/lite-serve/main.mjs dist/lite/tools/lite-serve/
          cp LICENSE ThirdPartyLicenses.txt dist/lite/
          cp docs/cellular-telemetry.md dist/lite/README.md
          cd dist/lite
          zip -qr ../mur-voir-lite-${VERSION}.zip .
      - uses: actions/upload-artifact@v7
        with:
          name: mur-voir-lite
          path: dist/mur-voir-lite-*.zip

  desktop:
    name: Package ${{ matrix.os }} ${{ matrix.arch }}
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: macos-latest, os: mac, arch: arm64 }
          - { runner: macos-latest, os: mac, arch: x64 }
          - { runner: windows-latest, os: win, arch: x64 }
          - { runner: windows-latest, os: win, arch: arm64 }
          - { runner: ubuntu-24.04, os: linux, arch: x64 }
          - { runner: ubuntu-24.04, os: linux, arch: arm64 }
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "22.x"
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v8
        with:
          name: desktop-bundles
          path: bundles
      - name: Build installer
        shell: bash
        run: |
          if [ "${{ matrix.os }}" = "linux" ]; then
            npx electron-builder --linux AppImage --${{ matrix.arch }} --publish never
          else
            npx electron-builder --${{ matrix.os }} --${{ matrix.arch }} --publish never
          fi
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
          ELECTRON_BUILDER_7Z_FILTER: BCJ
      - uses: actions/upload-artifact@v7
        with:
          name: mur-voir-${{ matrix.os }}-${{ matrix.arch }}
          path: |
            dist/mur-voir-*.dmg
            dist/mur-voir-*.exe
            dist/mur-voir-*.AppImage
          if-no-files-found: error

  release:
    name: Publish mur-voir release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [verify, lite, desktop]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - name: Verify release tag
        run: |
          VERSION=$(node -p "require('./package.json').version")
          test "$GITHUB_REF_NAME" = "v$VERSION"
          test -f "docs/release-notes/$VERSION.md"
      - uses: actions/download-artifact@v8
        with:
          pattern: mur-voir-*
          path: release-assets
          merge-multiple: true
      - name: Publish checked artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(node -p "require('./package.json').version")
          cd release-assets
          sha256sum * > SHA256SUMS.txt
          cd ..
          gh release create "$GITHUB_REF_NAME" release-assets/* --verify-tag \
            --title "mur-voir $VERSION" --notes-file "docs/release-notes/$VERSION.md" --latest
