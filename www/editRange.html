<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'" />
    <meta http-equiv="X-Content-Security-Policy" content="default-src 'self'; script-src 'self'" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="stylesheet" href="global.css" />
    <link rel="stylesheet" href="prompts.css" />
    <script type="module" src="../bundles/editRange.js"></script>
    <title>Edit Range &mdash; mur-voir</title>
  </head>

  <body>
    <table>
      <tbody>
        <tr class="limits" hidden>
          <td class="title" colspan="3" id="field"></td>
        </tr>
        <tr>
          <td class="label" id="max-label">Maximum Value</td>
          <td class="input">
            <input type="number" id="max" title="Maximum value" />
          </td>
          <td class="unit" hidden></td>
        </tr>
        <tr>
          <td class="label" id="min-label">Minimum Value</td>
          <td class="input">
            <input type="number" id="min" title="Minimum value" />
          </td>
          <td class="unit" hidden></td>
        </tr>
        <tr class="limits" hidden>
          <td class="info" colspan="3">
            Leave the box blank for no limit.<br />Outside these limits, the tile shows Alarm.
          </td>
        </tr>
        <tr class="limits" hidden>
          <td class="info" id="error" colspan="3" role="alert"></td>
        </tr>
      </tbody>
    </table>
    <button id="exit" title="Cancel">
      <img src="symbols/close.svg" />
    </button>
    <button id="confirm" title="Confirm">
      <img src="symbols/check.svg" />
    </button>
  </body>
</html>
