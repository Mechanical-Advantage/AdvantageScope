<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'" />
    <meta http-equiv="X-Content-Security-Policy" content="default-src 'self'; script-src 'self'" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="stylesheet" href="global.css" />
    <link rel="stylesheet" href="prompts.css" />
    <script type="module" src="../bundles/preferences.js"></script>
    <title>Preferences &mdash; mur-voir</title>
  </head>

  <body>
    <table>
      <tbody>
        <tr class="hide-lite">
          <td class="label">Application Theme</td>
          <td class="input">
            <select id="theme" title="Select the application theme">
              <option value="system">Match System</option>
              <option value="light">Always Light</option>
              <option value="dark">Always Dark</option>
            </select>
          </td>
        </tr>
        <tr>
          <td class="label">Timestamps</td>
          <td class="input">
            <select id="timestamps" title="Select how timestamps are displayed">
              <option value="start-zero">Start at Zero</option>
              <option value="original">Original</option>
            </select>
          </td>
        </tr>
        <tr>
          <td class="title" colspan="2">
            <hr />
            Networking Options
          </td>
        </tr>
        <tr>
          <td class="subtitle" colspan="2">The live source can be selected in the "File" menu.</td>
        </tr>
        <tr class="hide-lite">
          <td class="label">Live Address</td>
          <td class="input">
            <input
              type="text"
              id="robotAddress"
              placeholder="Source default"
              title="Enter the IP address or hostname of the live source (leave empty for the source default)"
            />
          </td>
        </tr>
        <tr>
          <td class="label">Lite Log Folder</td>
          <td class="input">
            <input type="text" id="remotePath" title="Enter the folder on the Lite server to list log files from" />
          </td>
        </tr>
        <tr class="hide-lite">
          <td class="label">DBC Folder</td>
          <td class="input">
            <input
              type="text"
              id="dbcFolder"
              placeholder="Bundled (mur-msgs)"
              title="Enter a folder of .dbc files (searched recursively) for decoding CAN logs, or leave empty for the bundled mur-msgs DBCs"
            />
          </td>
        </tr>
        <tr>
          <td class="label">Live Mode</td>
          <td class="input">
            <select id="liveSubscribeMode" title="Select live data subscription mode">
              <option value="low-bandwidth">Low Bandwidth</option>
              <option value="logging">Logging</option>
            </select>
          </td>
        </tr>
        <tr>
          <td class="label">Discard Live Data</td>
          <td class="input">
            <select id="liveDiscard" title="Select how long to retain live data before discarding">
              <option value="60">After 1 Minute</option>
              <option value="300">After 5 Minutes</option>
              <option value="1200">After 20 Minutes</option>
              <option value="-1">Never</option>
            </select>
          </td>
        </tr>
      </tbody>
    </table>
    <button id="exit" title="Cancel">
      <img src="symbols/close.svg" />
    </button>
    <button id="confirm" title="Confirm">
      <img src="symbols/check.svg" />
    </button>
  </body>
</html>
