  alphaRelease: "БҰЛ АЛЬФА-ШЫҒАРЫЛЫМ"
  descDesktop: "AdvantageScope алдағы мүмкіндіктерін сынауға және жақсартуға көмектескеніңіз үшін рақмет! Жалғастырмас бұрын әрбір мәлімдемемен танысқаныңызды растау үшін төмендегі ұяшықтарды белгілеңіз."
